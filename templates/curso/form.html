<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Curso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h1 class="h3 mb-3">Novo Curso</h1>

        <div class="card shadow-sm">
          <div class="card-body">
            <form action="/curso/salvar" method="post">
              <input type="hidden" name="id" value="{{ curso.id if curso else '' }}">

              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome"
                       value="{{ curso.nome if curso else '' }}" required>
              </div>

              <div class="mb-3">
                <label for="area" class="form-label">Área</label>
                <input type="text" class="form-control" id="area" name="area"
                       value="{{ curso.area if curso else '' }}" required>
              </div>

              <button type="submit" class="btn btn-primary">Salvar</button>
              <a href="/curso/" class="btn btn-outline-secondary">Cancelar</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
